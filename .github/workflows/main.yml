name: VOX Availability Checker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-vox:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check VOX and Telegram
        env:
          VOX_BOT_TOKEN: ${{ secrets.VOX_BOT_TOKEN }}
        run: |
          python vox_alert.py

      - name: Save alert and subscriber state
        run: |
          git config user.name "VOX Alert Bot"
          git config user.email "vox-alert-bot@users.noreply.github.com"

          git add alert_state.json

          if [ -f subscribers.json ]; then
            git add subscribers.json
          fi

          if [ -f telegram_offset.txt ]; then
            git add telegram_offset.txt
          fi

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update VOX alert state"
            git push
          fi
